# OpenOCD config for the SLogic16U3 (Gowin GW5AT-15) via FT2232 compatible JTAG adapters (channel A,
# ex: SQRL Acorn baseboard), for JTAGBone (litex_server --jtag). Forms accepted by OpenOCD 0.11/0.12.

adapter driver ftdi
adapter speed 1000
transport select jtag
ftdi_vid_pid 0x0403 0x6010
ftdi_channel 0
ftdi_layout_init 0x0008 0x000b
reset_config none

set _CHIPNAME gw5a
jtag newtap $_CHIPNAME tap -irlen 8 -expected-id 0x0001681b
